openapi: 3.1.0
info:
  title: RichAPI API
  version: 1.0.0
  description: Includes every public endpoint plus whatever internal endpoints
    have been granted to your team.
servers:
  - url: https://api.richapi.ai/api/v1
tags:
  - name: Getting Started
    description: >
      Make your first API call in under 5 minutes.


      ## Base URL


      `https://api.richapi.ai/api/v1/`


      ## Authentication


      Every request requires an API key passed via the `x-api-key` header.


      **cURL**


      ```bash

      curl https://api.richapi.ai/api/v1/my-endpoints \
        -H "x-api-key: YOUR_API_KEY"
      ```


      **Python**


      ```python

      import requests


      response = requests.get(
          "https://api.richapi.ai/api/v1/my-endpoints",
          headers={"x-api-key": "YOUR_API_KEY"},
      )

      print(response.json())

      ```


      **JavaScript**


      ```javascript

      const response = await fetch("https://api.richapi.ai/api/v1/my-endpoints",
      {
        headers: { "x-api-key": "YOUR_API_KEY" },
      });

      console.log(await response.json());

      ```


      ### Your First API Call


      Enrich a LinkedIn profile:


      **cURL**


      ```bash

      curl -X POST https://api.richapi.ai/api/v1/enrich_profile \
        -H "x-api-key: YOUR_API_KEY" \
        -H "Content-Type: application/json" \
        -d '{"url": "https://www.linkedin.com/in/satyanadella"}'
      ```


      **Python**


      ```python

      import requests


      response = requests.post(
          "https://api.richapi.ai/api/v1/enrich_profile",
          headers={
              "x-api-key": "YOUR_API_KEY",
              "Content-Type": "application/json",
          },
          json={"url": "https://www.linkedin.com/in/satyanadella"},
      )

      print(response.json())

      ```


      **JavaScript**


      ```javascript

      const response = await
      fetch("https://api.richapi.ai/api/v1/enrich_profile", {
        method: "POST",
        headers: {
          "x-api-key": "YOUR_API_KEY",
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ url: "https://www.linkedin.com/in/satyanadella" }),
      });

      const profile = await response.json();

      console.log(profile);

      ```


      Response:


      ```json

      {
        "firstname": "Satya",
        "lastname": "Nadella",
        "headline": "Chairman and CEO at Microsoft",
        "summary": "...",
        "picture": "https://...",
        "industry": "Technology",
        "location": {
          "country": "United States",
          "city": "Redmond",
          "state": "Washington"
        }
      }

      ```


      ### Check Your Usage


      Monitor your credit consumption anytime:


      **cURL**


      ```bash

      curl https://api.richapi.ai/api/v1/usage \
        -H "x-api-key: YOUR_API_KEY"
      ```


      **Python**


      ```python

      import requests


      response = requests.get(
          "https://api.richapi.ai/api/v1/usage",
          headers={"x-api-key": "YOUR_API_KEY"},
      )

      print(response.json())

      ```


      **JavaScript**


      ```javascript

      const response = await fetch("https://api.richapi.ai/api/v1/usage", {
        headers: { "x-api-key": "YOUR_API_KEY" },
      });

      console.log(await response.json());

      ```
  - name: Credits & Pricing
    description: >
      Credit-based billing system.


      ## Billing Rules


      - **Only successful calls are billed.** A non-2xx response deducts no
      credits.

      - **Per-result billing** (e.g. `people_search`) charges for the actual
      number of results returned, not the total available.

      - **Per-person/email billing** (e.g. email finding/verification) charges
      for the number of items in your `data` array.

      - **Inquiry-type endpoints are free.** Check results as many times as you
      want.


      ## Checking Your Usage


      **cURL**


      ```bash

      # Current month

      curl https://api.richapi.ai/api/v1/usage \
        -H "x-api-key: YOUR_API_KEY"

      # Specific month

      curl "https://api.richapi.ai/api/v1/usage?month=2026-03" \
        -H "x-api-key: YOUR_API_KEY"
      ```


      **Python**


      ```python

      import requests


      # Current month

      response = requests.get(
          "https://api.richapi.ai/api/v1/usage",
          headers={"x-api-key": "YOUR_API_KEY"},
      )

      print(response.json())


      # Specific month

      response = requests.get(
          "https://api.richapi.ai/api/v1/usage",
          headers={"x-api-key": "YOUR_API_KEY"},
          params={"month": "2026-03"},
      )

      print(response.json())

      ```


      **JavaScript**


      ```javascript

      // Current month

      const response = await fetch("https://api.richapi.ai/api/v1/usage", {
        headers: { "x-api-key": "YOUR_API_KEY" },
      });

      console.log(await response.json());


      // Specific month

      const monthly = await
      fetch("https://api.richapi.ai/api/v1/usage?month=2026-03", {
        headers: { "x-api-key": "YOUR_API_KEY" },
      });

      console.log(await monthly.json());

      ```


      Response:


      ```json

      {
        "months": ["2026-03"],
        "total_credits": 42.5,
        "apis": {
          "enrich_profile": {
            "calls": 25,
            "credits": 25
          },
          "people_search": {
            "calls": 5,
            "credits": 17.5
          }
        }
      }

      ```


      ## Rate Limits


      Every API key has a request-rate tier; exceeding it returns `429` with a

      `Retry-After` header indicating how many seconds to wait before retrying.

      Status polls are exempt. See the Error Handling guide for the exact

      response shape.
  - name: Error Handling
    description: >
      ## HTTP Status Codes


      | Code | Meaning | Billed? |

      |------|---------|---------|

      | `200` / `201` | Success | Yes |

      | `400` | Bad Request — invalid parameters | No |

      | `401` / `403` | Unauthorized/Forbidden — missing or invalid API key | No
      |

      | `402` | Insufficient credits | No |

      | `404` | Not Found — unknown endpoint | No |

      | `429` | Too Many Requests — quota exceeded | No |

      | `500` | Internal Server Error | No |

      | `502` / `504` | Upstream service error or timeout | No |


      ## Error Response Format


      Every error is a flat JSON object with an `error` string; some add fields
      specific to that failure:


      ```json

      {
        "error": "Description of what went wrong"
      }

      ```


      ## Common Errors


      ### Missing or Invalid API Key (401 / 403)


      ```json

      {
        "error": "No API access configured for this key"
      }

      ```


      Fix: Add the `x-api-key` header to every request.


      ### Unknown Endpoint (404)


      ```json

      {
        "error": "Unknown API: nonexistent. Use GET /api/v1/my-endpoints to see available APIs."
      }

      ```


      Fix: Check the endpoint name. There is no `available_apis` list in the

      response body — use `GET /api/v1/my-endpoints` to see what's callable.


      ### Insufficient Credits (402)


      ```json

      {
        "error": "Insufficient credits",
        "reserved": "5",
        "balance": "2.5"
      }

      ```


      Fix: Top up your account, or reduce the batch size of the request.


      ### Too Many Requests (429)


      ```json

      {
        "error": "Too Many Requests"
      }

      ```


      Fix: Wait for the number of seconds given in the `Retry-After` response
      header, then retry.


      ### Under Maintenance (503)


      ```json

      {
        "error": "This endpoint is under maintenance. It will be available again soon.",
        "code": "ENDPOINT_UNDER_MAINTENANCE"
      }

      ```


      Fix: Temporary — retry later. Contact support if it persists.


      ### Upstream / Timeout Errors (502 / 504)


      ```json

      {
        "error": "The upstream service is temporarily unavailable. Please try again later."
      }

      ```


      Fix: This is a server-side issue. Retry with backoff (see below); if it
      persists, contact support.


      ## Retry Strategy


      Retry `429`, `502`, and `504` with exponential backoff. Other 4xx errors
      will not succeed on retry without changing the request.


      ```python

      import time

      import requests


      def call_api(url, data, api_key, max_retries=3):
          for attempt in range(max_retries):
              response = requests.post(
                  url,
                  json=data,
                  headers={
                      "x-api-key": api_key,
                      "Content-Type": "application/json",
                  },
              )

              if response.status_code == 200:
                  return response.json()

              if response.status_code in (429, 502, 504):
                  wait = 2 ** attempt  # 1s, 2s, 4s
                  time.sleep(wait)
                  continue

              # Non-retryable error
              response.raise_for_status()

          raise Exception("Max retries exceeded")
      ```
  - name: AI
    description: Enrich, classify, extract, or summarize text using OpenAI,
      Anthropic, Gemini, or Perplexity.
  - name: Activity
    description: Fetch recent posts, comments, and reactions from a LinkedIn profile.
  - name: Ads
    description: Search and inspect ad activity across LinkedIn, Google, and Meta.
  - name: Directory
    description: Look up structured business and contact directory data.
  - name: Enrichment
    description: Enrich LinkedIn profiles and company pages with detailed data.
  - name: Funding Data
    description: Look up company funding rounds and investor data.
  - name: Leads
    description: Search and qualify leads by company and contact filters.
  - name: Maps
    description: Search places and business listings via Google Maps.
  - name: Posts
    description: Search and retrieve LinkedIn posts by keyword or author.
  - name: Search
    description: Search across 400M+ enriched LinkedIn profiles and posts with
      powerful filters.
  - name: Social
    description: Pull social metrics and links for a given profile or domain.
  - name: Utilities
    description: Helper endpoints for parsing, normalizing, and formatting data.
  - name: Waterfall
    description: Chain multiple providers to maximize match rate on a single request.
  - name: Web Scraping
    description: Scrape and extract structured data from any web page.
  - name: YouTube
    description: Search and retrieve YouTube channel, video, and search data.
x-tagGroups:
  - name: Guides
    tags:
      - Getting Started
      - Credits & Pricing
      - Error Handling
  - name: Endpoints
    tags:
      - AI
      - Activity
      - Ads
      - Directory
      - Enrichment
      - Funding Data
      - Leads
      - Maps
      - Posts
      - Search
      - Social
      - Utilities
      - Waterfall
      - Web Scraping
      - YouTube
paths:
  /ai_enrich:
    post:
      operationId: ai_enrich
      summary: AI Enrich
      description: >-
        Enrich, classify, extract, or summarize text using OpenAI, Anthropic,
        Gemini, or Perplexity.


        **Pricing:** 2 credits per call
      tags:
        - AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  description: "AI provider: openai, anthropic, gemini, or perplexity"
                  pattern: ^(openai|anthropic|gemini|perplexity)$
                  enum:
                    - openai
                    - anthropic
                    - gemini
                    - perplexity
                prompt:
                  type: string
                  description: Prompt template; use {{fieldName}} placeholders for dynamic values
                model:
                  type: string
                  description: Model override; defaults to provider default model
                temperature:
                  type: number
                  description: Sampling temperature between 0 and 2
                  default: 0.3
                context:
                  type: object
                  description: Key-value pairs used for {{placeholder}} substitution in the prompt
                  default: {}
                system_prompt:
                  type: string
                  description: Optional system prompt or instructions
                output_type:
                  type: string
                  description: "Output format: text or json"
                  default: text
                  pattern: ^(text|json)$
                output_schema:
                  type: object
                  description: JSON schema used to guide structured output when output_type is
                    json
                  default: {}
                max_tokens:
                  type: integer
                  description: Maximum output tokens; defaults to provider default
                  default: 4096
                use_web_search:
                  type: boolean
                  description: Enable web search when supported by the selected provider
                  default: false
                search_domain_filter:
                  type: array
                  description: Perplexity only; limit search to specific domains
                search_recency_filter:
                  type: string
                  description: "Perplexity only; filter by recency: day, week, month, year"
                  pattern: ^(day|week|month|year)?$
                  enum:
                    - day
                    - week
                    - month
                    - year
              required:
                - prompt
                - provider
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
              example:
                content: Northwind Robotics automates warehouse workflows.
                finish_reason: stop
                input_tokens: 18
                model: gpt-4o-mini
                output_tokens: 12
                provider: openai
                tokens_used: 30
        4XX:
          description: Client error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        5XX:
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - API Key: []
      x-pricing:
        credits_per_call: 2
  /clean_domain:
    post:
      operationId: clean_domain
      summary: Clean Domain
      description: |-
        Normalize a messy URL or domain string to a clean root domain.

        **Pricing:** 0.5 credits per call
      tags:
        - Utilities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messy_url:
                  type: string
                  description: URL or domain to normalize (e.g. https://www.Example.COM/page?q=1)
              required:
                - messy_url
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
              example:
                clean_domain: acme.com
                clean_url: https://www.acme.com
                validated_domain: true
        4XX:
          description: Client error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        5XX:
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - API Key: []
      x-pricing:
        credits_per_call: 0.5
  /count_occurrences:
    post:
      operationId: count_occurrences
      summary: Count Occurrences
      description: >-
        Count how many times a substring appears in a string, with optional
        case-insensitive matching.


        **Pricing:** 0.5 credits per call
      tags:
        - Utilities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: string
                  description: Input string to search within
                separator:
                  type: string
                  description: Substring to split and count by
                case_insensitive:
                  type: boolean
                  description: Case-insensitive matching (default false)
                  default: false
                limit:
                  type: integer
                  description: Max results to return (0 for all, max 1000)
                  default: 0
              required:
                - input
                - separator
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
              example:
                results:
                  - count: 2
                    item: foo
                  - count: 1
                    item: bar
                  - count: 1
                    item: baz
                total_items: 4
                unique_items: 3
        4XX:
          description: Client error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        5XX:
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - API Key: []
      x-pricing:
        credits_per_call: 0.5
  /crunchbase_company_scraper_sync:
    post:
      operationId: crunchbase_company_scraper_sync
      summary: Crunchbase Company Scraper
      description: >-
        Scrape Crunchbase company profiles — funding rounds, investors, employee
        count, and more.


        **Pricing:** 3 credits per call
      tags:
        - Funding Data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                crunchbase_company_url:
                  type: string
                  description: URL of the company's profile on Crunchbase (e.g.
                    https://www.crunchbase.com/organization/openai)
              required:
                - crunchbase_company_url
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
              example:
                Description: example
                Founded Date: example
                Headquarters Location: example
                Industries: example
                Last Funding Date: example
                Last Funding Type: example
                LinkedIn: example
                Number of Employees: example
                Organization Name: example
                Total Funding Amount (in USD): 1
                Website: example
        4XX:
          description: Client error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        5XX:
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - API Key: []
      x-pricing:
        credits_per_call: 3
  /directory_yellowpages:
    post:
      operationId: directory_yellowpages
      summary: Yellow Pages Search
      description: >-
        Search Yellow Pages for businesses with name, phone, address, website,
        and categories.


        **Pricing:** 0.01 credits per result
      tags:
        - Directory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                search_query:
                  type: string
                  description: Business type or name to search for.
                location:
                  type: string
                  description: City, state, or ZIP code.
                page:
                  type: integer
                  description: Page number for pagination (default 1).
                  default: 1
                max_pages:
                  type: integer
                  description: Maximum number of pages to scrape.
                  default: 1
              required:
                - location
                - search_query
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  businesses:
                    - address: 1 Example Street, Springfield
                      categories:
                        - Plumbers
                        - Water Heaters
                      name: ABC Plumbing
                      phone: (512) 555-0123
                      rating: 4.8
                      website: https://abcplumbing.example.com
        4XX:
          description: Client error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        5XX:
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - API Key: []
      x-pricing:
        base_credits_per_call: 0
        credits_per_result: 0.01
        result_count_field: _list_count
  /distribute_leads:
    post:
      operationId: distribute_leads
      summary: Distribute Leads
      description: >-
        Round-robin distribute leads across a set of assignment labels (e.g.
        sales reps).


        **Pricing:** 0.5 credits per call
      tags:
        - Utilities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignment_labels:
                  type: string
                  description: Comma-separated assignment labels (e.g. Team A,Team B,Team C)
                values_associated_with_labels:
                  type: string
                  description: Comma-separated values to distribute (e.g. alice@example.com,bob@example.com)
                current_index:
                  type: integer
                  description: Starting index for round-robin (default 0)
                  default: 0
              required:
                - values_associated_with_labels
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
              example:
                assignments: []
                next_index: 1
        4XX:
          description: Client error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        5XX:
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - API Key: []
      x-pricing:
        credits_per_call: 0.5
  /email_finder:
    post:
      operationId: email_finder
      summary: Email Finder
      description: >-
        Find a verified work email using name, domain, or LinkedIn URL. Tries
        multiple providers automatically.


        **Pricing:** 5 credits per call
      tags:
        - Enrichment
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  description: First name (required if no linkedin_url)
                last_name:
                  type: string
                  description: Last name (required if no linkedin_url)
                company_domain:
                  type: string
                  description: Company domain (required if no linkedin_url)
                linkedin_url:
                  type: string
                  description: LinkedIn profile URL (alternative to name + domain)
                company_name:
                  type: string
                  description: Company name (optional, improves accuracy)
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
              example:
                confidence: example
                email: example
                provider: example
        4XX:
          description: Client error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        5XX:
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - API Key: []
      x-pricing:
        credits_per_call: 5
  /email_verifier:
    post:
      operationId: email_verifier
      summary: Email Verifier
      description: |-
        Verify email deliverability and validity via multi-provider waterfall.

        **Pricing:** 2 credits per call
      tags:
        - Waterfall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Email address to verify
                  pattern: ^[^\s@]+@[^\s@]+\.[^\s@]+$
              required:
                - email
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
              example:
                disposable: true
                email: example
                mxFound: true
                status: example
                valid: true
        4XX:
          description: Client error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        5XX:
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - API Key: []
      x-pricing:
        credits_per_call: 2
  /encode_uri:
    post:
      operationId: encode_uri
      summary: Encode URI
      description: |-
        URL-encode a string for safe use in query parameters or path segments.

        **Pricing:** 0.5 credits per call
      tags:
        - Utilities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                  description: String to URL-encode (RFC 3986)
              required:
                - value
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
              example:
                encoded: example
        4XX:
          description: Client error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        5XX:
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - API Key: []
      x-pricing:
        credits_per_call: 0.5
  /enrich_companies_bulk:
    post:
      operationId: enrich_companies_bulk
      summary: Bulk Company Enrichment
      description: >-
        Fetch up to 50 LinkedIn company profiles in a single call using company
        IDs.


        **Pricing:** 1 credit per result
      tags:
        - Enrichment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                urns:
                  type: array
                  description: List of numeric LinkedIn company IDs (max 50)
              required:
                - urns
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
        4XX:
          description: Client error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        5XX:
          description: Server error.
