  /usage:
    get:
      operationId: usage
      summary: Usage
      description: Return the supplied API key's team-wide credit consumption and
        current balance.
      tags:
        - Credits & Pricing
      parameters:
        - name: month
          in: query
          schema:
            type: string
            pattern: ^\d{4}-\d{2}$
        - name: months
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: include_previous
          in: query
          schema:
            type: boolean
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
        - name: include
          in: query
          schema:
            type: string
            enum:
              - history
        - name: history_limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: sort_by
          in: query
          schema:
            type: string
            enum:
              - credits
              - calls
              - name
        - name: order
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: filter
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Usage totals for the selected period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"
        4XX:
          description: Client error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        5XX:
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - API Key: []
components:
  securitySchemes:
    API Key:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    EndpointPricing:
      type: object
      description: The API key's effective, customer-safe price for this endpoint.
      properties:
        credits_per_call:
          type: number
        credits_per_result:
          type: number
        base_credits_per_call:
          type: number
        result_count_field:
          type: string
        min_credits_per_call:
          type: number
        max_credits_per_call:
          type: number
        conditional_components:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              when:
                type: object
                properties:
                  field:
                    type: string
                  equals: {}
              credits_per_call:
                type: number
              description:
                type: string
      additionalProperties: false
    ErrorResponse:
      type: object
      description: Every error response is a flat JSON object with an `error` string
        describing what went wrong, plus extra fields specific to that failure —
        see the endpoint description or the Error Handling section above for
        examples.
      properties:
        error:
          type: string
      required:
        - error
      additionalProperties: true
    MyEndpoint:
      type: object
      properties:
        name:
          type: string
        pricing:
          $ref: "#/components/schemas/EndpointPricing"
        status:
          type: string
          enum:
            - active
            - maintenance
        display_name:
          type: string
        description:
          type: string
        category:
          type: string
        request_schema:
          type: array
          items: {}
        input_schema:
          type: array
          items: {}
        example_response:
          oneOf:
            - type: object
            - type: array
      required:
        - name
        - pricing
        - status
        - request_schema
        - input_schema
        - example_response
      additionalProperties: false
    UsageResponse:
      type: object
      properties:
        months:
          type: array
          items:
            type: string
        total_credits:
          type: number
        total_cost:
          type: number
        credit_value:
          type: number
        total_records:
          type: integer
        apis:
          type: object
          additionalProperties:
            type: object
        credits_by_category:
          type: object
          additionalProperties:
            type: number
        credits_remaining:
          type:
            - number
            - "null"
        monthly_breakdown:
          type: object
          additionalProperties:
            type: object
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        history:
          type: array
          items:
            type: object
        history_count:
          type: integer
        pagination:
          type: object
          properties:
            limit:
              type: integer
            offset:
              type: integer
            total_records:
              type: integer
            current_count:
              type: integer
            has_more:
              type: boolean
          required:
            - limit
            - offset
            - total_records
            - current_count
            - has_more
      required:
        - months
        - total_credits
        - total_cost
        - credit_value
        - total_records
        - apis
        - credits_by_category
        - credits_remaining
